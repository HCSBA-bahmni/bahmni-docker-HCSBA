# Local HCSBA OpenMRS configuration. Secrets are resolved from container environment.
clientId=openmrs
clientSecret=${OPENMRS_OIDC_CLIENT_SECRET}
redirectUri=https://localhost/openmrs/oauth2login

# Only the browser-facing endpoints use the public issuer. Server-to-server calls stay on
# the private Compose network, avoiding DNS and development-CA dependencies in the JVM.
userAuthorizationUri=${KEYCLOAK_PUBLIC_URL}/realms/hcsba/protocol/openid-connect/auth
accessTokenUri=${KEYCLOAK_INTERNAL_URL}/realms/hcsba/protocol/openid-connect/token
userInfoUri=${KEYCLOAK_INTERNAL_URL}/realms/hcsba/protocol/openid-connect/userinfo
logoutUri=${KEYCLOAK_PUBLIC_URL}/realms/hcsba/protocol/openid-connect/logout?id_token_hint=[token]&post_logout_redirect_uri=https%3A%2F%2Flocalhost%2Fbahmni%2Flogin%3FloggedOut%3D1
logoutUri.encode.disabled=true
keysUrl=${KEYCLOAK_INTERNAL_URL}/realms/hcsba/protocol/openid-connect/certs
scope=openid,profile,email

openmrs.mapping.user.username=preferred_username
openmrs.mapping.user.systemId=openmrs_system_id
openmrs.mapping.person.givenName=given_name
openmrs.mapping.person.familyName=family_name
openmrs.mapping.user.email=email
openmrs.mapping.user.roles=openmrs_roles
openmrs.mapping.user.provider=openmrs_provider
openmrs.mapping.user.username.serviceAccount=azp

jwt.requireStrictValidation=true
jwt.expectedIssuer=${KEYCLOAK_PUBLIC_URL}/realms/hcsba
jwt.expectedAudience=openmrs
jwt.expectedTokenType=Bearer
jwt.allowedClockSkewSeconds=30
jwt.jwksRefreshSeconds=300
jwt.logoutTokenMaxAgeSeconds=300

# Correlate Keycloak sid/sub with the local OpenMRS servlet session so an
# administrative Keycloak logout also invalidates JSESSIONID.
backchannelLogout.enabled=true
