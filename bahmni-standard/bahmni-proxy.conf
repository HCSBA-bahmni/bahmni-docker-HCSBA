LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so

Redirect permanent /home /bahmni/home/

<IfDefine LOCAL_OPENMRS>
# Isolated local clone. Patient files remain inside local Docker volumes and OpenELIS is
# deliberately unavailable so a development session cannot mutate a remote integration.
ProxyPass /uploaded-files http://patient-documents/uploaded-files
ProxyPassReverse /uploaded-files http://patient-documents/uploaded-files
ProxyPass /document_images http://patient-documents/document_images
ProxyPassReverse /document_images http://patient-documents/document_images
ProxyPass /uploaded_results http://patient-documents/uploaded_results
ProxyPassReverse /uploaded_results http://patient-documents/uploaded_results
ProxyPass /openelis http://openmrs-local:8080/__hcsba_local_openelis_disabled__
ProxyPassReverse /openelis http://openmrs-local:8080/__hcsba_local_openelis_disabled__
ProxyPass /openmrs/auth http://openmrs-local:8080/openmrs/auth
ProxyPassReverse /openmrs/auth http://openmrs-local:8080/openmrs/auth
</IfDefine>

<IfDefine !LOCAL_OPENMRS>
# Shared DEV backend. These routes are active only when the isolated local profile is off.
ProxyPass /uploaded-files https://10.68.174.205/uploaded-files
ProxyPassReverse /uploaded-files https://10.68.174.205/uploaded-files
ProxyPass /document_images https://10.68.174.205/document_images
ProxyPassReverse /document_images https://10.68.174.205/document_images
ProxyPass /uploaded_results https://10.68.174.205/uploaded_results
ProxyPassReverse /uploaded_results https://10.68.174.205/uploaded_results
ProxyPass /openmrs/auth https://10.68.174.205/openmrs/auth
ProxyPassReverse /openmrs/auth https://10.68.174.205/openmrs/auth
ProxyPass /openelis https://10.68.174.205/openelis
ProxyPassReverse /openelis https://10.68.174.205/openelis
</IfDefine>

# Appointments
ProxyPass /appointments http://appointments/appointments
ProxyPassReverse /appointments http://appointments/appointments

# IPD
ProxyPass /ipd http://ipd/ipd
ProxyPassReverse /ipd http://ipd/ipd

# OpenMRS backend cutover is explicit and mutually exclusive.
<IfDefine LOCAL_OPENMRS>
ProxyPass        /openmrs http://openmrs-local:8080/openmrs connectiontimeout=5 timeout=120 keepalive=On
ProxyPassReverse /openmrs http://openmrs-local:8080/openmrs
</IfDefine>
<IfDefine !LOCAL_OPENMRS>
ProxyPass        /openmrs https://10.68.174.205/openmrs connectiontimeout=5 timeout=120 keepalive=On
ProxyPassReverse /openmrs https://10.68.174.205/openmrs
</IfDefine>

# Shared Next.js runtime. Keep these rules before the legacy /bahmni prefix.
ProxyPass        /bahmni/_next/webpack-hmr ws://bahmni-next-web:3000/bahmni/_next/webpack-hmr
ProxyPassReverse /bahmni/_next/webpack-hmr ws://bahmni-next-web:3000/bahmni/_next/webpack-hmr
ProxyPass        /bahmni/_next http://bahmni-next-web:3000/bahmni/_next
ProxyPassReverse /bahmni/_next http://bahmni-next-web:3000/bahmni/_next
ProxyPass        /bahmni/api http://bahmni-next-web:3000/bahmni/api
ProxyPassReverse /bahmni/api http://bahmni-next-web:3000/bahmni/api
ProxyPass        /bahmni/i18n http://bahmni-next-web:3000/bahmni/i18n
ProxyPassReverse /bahmni/i18n http://bahmni-next-web:3000/bahmni/i18n

# Module cutovers are controlled by Apache defines in NEXT_PROXY_DEFINES.
# Removing one define and recreating only proxy rolls that module back to bahmni-web.
<IfDefine NEXT_SHELL>
ProxyPass        /bahmni/home http://bahmni-next-web:3000/bahmni/home
ProxyPassReverse /bahmni/home http://bahmni-next-web:3000/bahmni/home
ProxyPass        /bahmni/login http://bahmni-next-web:3000/bahmni/login
ProxyPassReverse /bahmni/login http://bahmni-next-web:3000/bahmni/login
ProxyPass        /bahmni/location http://bahmni-next-web:3000/bahmni/location
ProxyPassReverse /bahmni/location http://bahmni-next-web:3000/bahmni/location
ProxyPass        /bahmni/change-password http://bahmni-next-web:3000/bahmni/change-password
ProxyPassReverse /bahmni/change-password http://bahmni-next-web:3000/bahmni/change-password
ProxyPassMatch ^/bahmni/home$ !
</IfDefine>

<IfDefine NEXT_REGISTRATION>
ProxyPass        /bahmni/registration http://bahmni-next-web:3000/bahmni/registration
ProxyPassReverse /bahmni/registration http://bahmni-next-web:3000/bahmni/registration
</IfDefine>

<IfDefine NEXT_CLINICAL>
ProxyPass        /bahmni/clinical http://bahmni-next-web:3000/bahmni/clinical
ProxyPassReverse /bahmni/clinical http://bahmni-next-web:3000/bahmni/clinical
</IfDefine>

<IfDefine NEXT_BEDMANAGEMENT>
ProxyPass        /bahmni/bedmanagement http://bahmni-next-web:3000/bahmni/bedmanagement
ProxyPassReverse /bahmni/bedmanagement http://bahmni-next-web:3000/bahmni/bedmanagement
</IfDefine>

<IfDefine NEXT_ADT>
ProxyPass        /bahmni/adt http://bahmni-next-web:3000/bahmni/adt
ProxyPassReverse /bahmni/adt http://bahmni-next-web:3000/bahmni/adt
</IfDefine>

# Bahmni Web legacy fallback
ProxyPass /bahmni http://bahmni-web:8091/bahmni
ProxyPassReverse /bahmni http://bahmni-web:8091/bahmni
Header set X-Robots-Tag "noindex, nofollow"

#Bahmni Person Management
ProxyPass /person-management http://bahmni-web:8091/person-management
ProxyPassReverse /person-management http://bahmni-web:8091/person-management

ProxyPass /bahmni_config/openmrs/apps http://bahmni-web:8091/bahmni_config/openmrs/apps
ProxyPassReverse /bahmni_config/openmrs/apps http://bahmni-web:8091/bahmni_config/openmrs/apps

ProxyPass /bahmni_config/openmrs/i18n http://bahmni-web:8091/bahmni_config/openmrs/i18n
ProxyPassReverse /bahmni_config/openmrs/i18n http://bahmni-web:8091/bahmni_config/openmrs/i18n

#Implementer Interface
ProxyPass /implementer-interface http://implementer-interface/implementer-interface
ProxyPassReverse /implementer-interface http://implementer-interface/implementer-interface

#Bahmni Lab
ProxyPass /lab http://bahmni-lab:80/lab
ProxyPassReverse /lab http://bahmni-lab:80/lab

#Bahmni-Reports
ProxyPass /bahmnireports http://reports:8051/bahmnireports
ProxyPassReverse /bahmnireports http://reports:8051/bahmnireports

#DCM4CHEE
ProxyPass /dcm4chee-web3 http://dcm4chee:8055/dcm4chee-web3
ProxyPassReverse /dcm4chee-web3 http://dcm4chee:8055/dcm4chee-web3

#Oviyam2
ProxyPass /oviyam2 http://dcm4chee:8055/oviyam2
ProxyPassReverse /oviyam2 http://dcm4chee:8055/oviyam2

#Atomfeed-console
ProxyPass /atomfeed-console http://atomfeed-console:9080/atomfeed-console
ProxyPassReverse /atomfeed-console http://atomfeed-console:9080/atomfeed-console

#Metabase
ProxyPass /metabase http://metabase:3000
ProxyPassReverse /metabase http://metabase:3000

#Grafana
ProxyPass /grafana ws://grafana:3000/grafana
ProxyPassReverse /grafana ws://grafana:3000/grafana

LoadModule ssl_module modules/mod_ssl.so
LoadModule cache_module modules/mod_cache.so
LoadModule wsgi_module modules/mod_wsgi.so



#   Pass Phrase Dialog:
#   Configure the pass phrase gathering process.
#   The filtering dialog program (`builtin' is a internal
#   terminal dialog) has to provide the pass phrase on stdout.
SSLPassPhraseDialog  builtin

#   Semaphore:
#   Configure the path to the mutual exclusion semaphore the
#   SSL engine uses internally for inter-process synchronization.

Mutex posixsem

#   Pseudo Random Number Generator (PRNG):
#   Configure one or more sources to seed the PRNG of the
#   SSL library. The seed data should be of good random quality.
#   WARNING! On some platforms /dev/random blocks if not enough entropy
#   is available. This means you then cannot use the /dev/random device
#   because it would lead to very long connection times (as long as
#   it requires to make more entropy available). But usually those
#   platforms additionally provide a /dev/urandom device which doesn't
#   block. So, if available, use this one instead. Read the mod_ssl User
#   Manual for more details.
SSLRandomSeed startup file:/dev/urandom  256
SSLRandomSeed connect builtin

# Use "SSLCryptoDevice" to enable any supported hardware
# accelerators. Use "openssl engine -v" to list supported
# engine names.  NOTE: If you enable an accelerator and the
# server does not start, consult the error logs and ensure
# your accelerator is functioning properly.
#
SSLCryptoDevice builtin

#
# When we also provide SSL we have to listen to the
# the HTTPS port in addition.
#
Listen 443


<IfModule mod_cache.c>
	LoadModule cache_disk_module modules/mod_cache_disk.so
	<IfModule mod_cache_disk.c>
		CacheRoot /var/cache/mod_proxy

			    CacheEnable disk /home/bahmni/patient_images

				<Directory /home/bahmni/patient_images>
					Header unset Pragma
					Options Indexes FollowSymLinks
					Header set Cache-Control "max-age=86400"
				</Directory>

				CacheEnable disk /bahmni
                CacheEnable disk /openmrs/ws/rest/v1/concept

	    CacheDirLevels 5
		CacheDirLength 3
		CacheDefaultExpire 3600
		CacheMaxExpire 86400
		CacheIgnoreCacheControl On
		CacheIgnoreHeaders Set-Cookie
		CacheMaxFileSize 2000000
	</IfModule>

</IfModule>

<VirtualHost *:443>
    ServerName localhost
    SSLEngine on
    SSLProxyEngine on
    # Dev: el backend OpenMRS usa TLS/cert que no valida (self-signed / CN distinto), si no se desactiva falla con 500.
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off
    # Compatibilidad: permite negociar TLS viejo con el backend si aplica.
    SSLProxyProtocol all -SSLv2 -SSLv3
    SSLCertificateFile "/etc/tls/cert.pem"
    SSLCertificateKeyFile "/etc/tls/key.pem"

    # Punto de entrada canonico: Next valida la sesion OpenMRS y, en modo SSO,
    # inicia el flujo OIDC cuando no existe una JSESSIONID valida.
    RedirectMatch 302 ^/$ /bahmni/home/

    # Normaliza la URL de inicio manteniendo https (sin pasar por el redirect del backend)
    RedirectMatch 301 ^/bahmni/home$ /bahmni/home/

    RewriteEngine on
    RewriteCond %{REQUEST_URI} ^/grafana/api/*
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    Header set Content-Security-Policy upgrade-insecure-requests
    RewriteRule ^/?(.*) "ws://grafana:3000/$1" [P,L]

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/bahmni/_next/webpack-hmr$
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    Header set Content-Security-Policy upgrade-insecure-requests
    RewriteRule ^/?(.*) "ws://vakyansh-proxy:9009/$1" [P,L]

    RewriteEngine on

    RewriteCond %{REQUEST_URI} ^/openmrs/*
    RewriteCond %{HTTP_COOKIE} ^.*JSESSIONID=([^;]+)
    RewriteRule ^.*$ - [CO=reporting_session:%1:%{HTTP_HOST}:86400:/:true:true]

    # This configuration redirects any request with a host name starting with "payments-"
    # to the crater-nginx container, preserving the requested URL path.
    RewriteCond %{HTTP_HOST} ^payments-[^.]+
    RewriteRule (.*) http://crater-nginx$1 [P]

    # This configuration redirects any request with a host name starting with "erp-"
    # to the odoo container, preserving the requested URL path.
    RewriteCond %{HTTP_HOST} ^erp-[^.]+
    RewriteRule (.*) http://odoo:8069$1 [P]

    ProxyPreserveHost On

    #   SSL Protocol support:
    # List the enable protocol levels with which clients will be able to
    # connect.  Disable SSLv2 access by default:
    #SSLProtocol all -SSLv2
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1

    #   SSL Cipher Suite:
    # List the ciphers that the client is permitted to negotiate.
    # See the mod_ssl documentation for a complete list.
    #SSLCipherSuite ALL:!ADH:!EXPORT:!SSLv2:RC4+RSA:+HIGH:+MEDIUM:+LOW
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on

    SetEnvIf User-Agent ".*MSIE.*" \
         nokeepalive ssl-unclean-shutdown \
         downgrade-1.0 force-response-1.0

        #   Per-Server Logging:
        #   The home of a custom SSL log file. Use this when you want a
        #   compact non-error SSL logfile on a virtual host basis.
        CustomLog logs/ssl_request_log \
                "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"

    RewriteCond %{REMOTE_ADDR} !^123\.456\.789\.000
    RewriteCond %{DOCUMENT_ROOT}/maintenance.html -f
    RewriteCond %{DOCUMENT_ROOT}/maintenance.enable -f
    RewriteCond %{SCRIPT_FILENAME} !maintenance.html
    RewriteCond %{SCRIPT_FILENAME} !src.jpg
    RewriteCond %{SCRIPT_FILENAME} !favicon.png
    RewriteCond %{SCRIPT_FILENAME} !bahmni-logo.png
    RewriteRule ^.*$ /maintenance.html [R=503,L]
    ErrorDocument 503 /maintenance.html

    ProxyErrorOverride on 500 501 502
    ErrorDocument 500 /internalError.html

    <Files ~ "\.(cgi|shtml|phtml|php3?)$">
    SSLOptions +StdEnvVars
    </Files>
    <Directory "/usr/local/apache2/cgi-bin">
        SSLOptions +StdEnvVars
    </Directory>

    <filesMatch "\.(mp4|webm|ogg|3gp|3gpp|mpeg|wmv|avi|mov|mkv)$">
    FileETag None
    </filesMatch>

    WSGIDaemonProcess client_side_logging python-path=/usr/local/apache2/htdocs/client_side_logging threads=1
    WSGIScriptAlias /log /usr/local/apache2/htdocs/client_side_logging/client_side_logging.wsgi

    <Directory /usr/local/apache2/htdocs/client_side_logging>
        WSGIProcessGroup client_side_logging
        WSGIApplicationGroup %{GLOBAL}
        Order deny,allow
        Allow from all
    </Directory>
</VirtualHost>

<VirtualHost *:80>
  RewriteEngine On
  RewriteCond %{HTTPS} off

  RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI}
</VirtualHost>

ServerTokens Prod
ServerSignature Off

WSGISocketPrefix /var/run/wsgi

TraceEnable Off

# Optional second TLS virtual host supplied only by docker-compose.keycloak.yml.
# Keeping it outside the base image makes SSO opt-in and preserves rollback.
IncludeOptional conf/extra/hcsba-keycloak.conf
