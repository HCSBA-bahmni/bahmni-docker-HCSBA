<VirtualHost *:443>
    ServerName ${KEYCLOAK_PUBLIC_HOST}
    SSLEngine on
    SSLCertificateFile "/etc/tls/keycloak/cert.pem"
    SSLCertificateKeyFile "/etc/tls/keycloak/key.pem"

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "${KEYCLOAK_PUBLIC_HOST}"

    # Health and metrics are never public. The canonical Keycloak administration
    # paths are available only from the configured clinical/admin network or
    # from the trusted Docker proxy source used by local DEV.
    <LocationMatch "^/(health|metrics)(/|$)">
        Require all denied
    </LocationMatch>
    <LocationMatch "^/(admin|realms/master)(/|$)">
        Require ip ${KEYCLOAK_ADMIN_CIDR} ${KEYCLOAK_ADMIN_PROXY_CIDR} 127.0.0.1
    </LocationMatch>

    ProxyPass        / http://keycloak:8080/ connectiontimeout=5 timeout=120 keepalive=On
    ProxyPassReverse / http://keycloak:8080/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "SAMEORIGIN"
    ServerSignature Off
</VirtualHost>
